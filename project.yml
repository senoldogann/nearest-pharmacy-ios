name: NearestPharmacy
options:
  bundleIdPrefix: dev.senoldogan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  NearestPharmacy:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.senoldogan.nearestpharmacy
        PRODUCT_NAME: NearestPharmacy
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: minimal
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Nearest Pharmacy
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Nearest Pharmacy uses your location to find the pharmacies around you.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false

  NearestPharmacyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: NearestPharmacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.senoldogan.nearestpharmacy.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  NearestPharmacy:
    build:
      targets:
        NearestPharmacy: all
        NearestPharmacyTests: [test]
    test:
      targets:
        - NearestPharmacyTests
